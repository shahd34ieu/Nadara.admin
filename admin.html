<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Nadara Admin</title>
<style>:root{--bg:#FFF8F3;--cd:#fff;--tx:#3a2b36;--mu:#6b5663;--bd:#f1e3dc;color-scheme:light}@media (prefers-color-scheme:dark){:root{--bg:#1d1519;--cd:#2a1f25;--tx:#f6ebee;--mu:#cdb8c0;--bd:#3d2d35;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:16px;max-width:980px;margin:auto}
h1{margin:0 0 4px}.mu{color:var(--mu);font-size:13px}.cd{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0;overflow-x:auto}
button,input{font:inherit;color:inherit}button{border:0;border-radius:12px;padding:8px 14px;cursor:pointer;background:linear-gradient(135deg,#F0527A,#F59A3C);color:#fff;font-weight:700;margin:3px 3px 3px 0}button.g{background:var(--bd);color:var(--tx)}
input{background:var(--cd);border:2px solid var(--bd);border-radius:12px;padding:9px;width:100%;max-width:320px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;border-top:1px solid var(--bd);text-align:left;vertical-align:top}
.st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#ffe8c7;color:#8a4b00}.st.a{background:#d8f5ea;color:#0d5a43}.k{display:inline-block;background:var(--bd);border-radius:14px;padding:10px 16px;margin:0 8px 8px 0}.k b{font-size:22px;display:block}</style></head><body>
<h1>Nadara Admin</h1><p class="mu">Private console. Shows data stored in this browser on this device only. Do not publish this file publicly.</p><div id="r"></div>
<script>
const $=s=>document.querySelector(s),LS=localStorage,J=k=>{try{return JSON.parse(LS.getItem(k)||"null")}catch(e){return null}};
async function H(p,s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of s+p)h=(h*31+c.charCodeAt(0))|0;return"f"+h}}
const dl=(n,t,ty)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:ty||"application/json"}));a.download=n;a.click()};
const csv=r=>"\ufeff"+r.map(x=>x.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\n");
const strip=t=>String(t).replace(/<br>/g,"\n").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
function D(){return(J("nd:users")||[]).map(u=>({u,posts:J("nd:u:"+u.id+":up")||[],pl:J("nd:u:"+u.id+":pl")||[],chat:J("nd:u:"+u.id+":chat")||[]}))}
async function gate(e){const a=J("nd:adm"),p=$("#pc").value;if(p.length<6){$("#er").textContent="Use at least 6 characters.";return}
if(!a){const s=Math.random().toString(36).slice(2);LS.setItem("nd:adm",JSON.stringify({s,h:await H(p,s)}));sessionStorage.adm=1;draw()}else if(a.h==await H(p,a.s)){sessionStorage.adm=1;draw()}else $("#er").textContent="Wrong passcode."}
function draw(){const a=J("nd:adm");if(!sessionStorage.adm){$("#r").innerHTML=`<div class="cd"><b>${a?"Enter admin passcode":"Create an admin passcode"}</b><p><input id="pc" type="password" placeholder="Passcode"></p><p id="er" class="mu" style="color:#F0527A"></p><button onclick="gate()">${a?"Unlock":"Create"}</button></div>`;return}
const d=D(),ps=d.flatMap(x=>x.posts.map(p=>({x,p})));
$("#r").innerHTML=`<div>${[["Users",d.length],["Posts",ps.length],["Pending",ps.filter(y=>y.p[9]!="a").length],["Check-ins",d.reduce((s,x)=>s+x.pl.length,0)],["Questions",d.reduce((s,x)=>s+x.chat.filter(m=>m[0]=="u").length,0)]].map(k=>`<span class="k"><b>${k[1]}</b>${k[0]}</span>`).join("")}</div>
<div class="cd"><b>Export</b><p class="mu">Exports never include passwords.</p><button onclick="ex('u')">Users CSV</button><button onclick="ex('p')">Posts CSV</button><button onclick="ex('j')">Everything JSON</button> <button class="g" onclick="ex('b')">Full backup (with login data)</button><label class="g" style="display:inline-block;padding:8px 14px;border-radius:12px;background:var(--bd);cursor:pointer;font-weight:700">Restore backup<input type="file" accept=".json" style="display:none" onchange="rs(this)"></label></div>
<div class="cd"><b>Posts moderation</b><table><tr><th>Author</th><th>Title</th><th>Status</th><th></th></tr>${ps.map(y=>`<tr><td>${y.x.u.n}<div class="mu">${y.x.u.e}</div></td><td>${strip(y.p[3][0])}<div class="mu">${strip(y.p[4][0]).slice(0,90)}</div></td><td><span class="st ${y.p[9]=="a"?"a":""}">${y.p[9]=="a"?"Approved":"Under review"}</span></td><td>${y.p[9]!="a"?`<button onclick="mo('${y.x.u.id}','${y.p[8]}','a')">Approve</button>`:""}<button class="g" onclick="mo('${y.x.u.id}','${y.p[8]}','d')">Delete</button></td></tr>`).join("")||"<tr><td>No posts yet</td></tr>"}</table></div>
<div class="cd"><b>Users</b><table><tr><th>Name</th><th>Email</th><th>Joined</th><th>Skin</th><th>Posts</th><th>Check-ins</th><th>Questions</th></tr>${d.map(x=>`<tr><td>${x.u.n}</td><td>${x.u.e}</td><td>${new Date(x.u.c).toLocaleDateString()}</td><td>${x.u.pf.skin||"-"}${x.u.pf.pcos?" · PCOS":""}${x.u.pf.preg?" · Pregnant":""}</td><td>${x.posts.length}</td><td>${x.pl.length}</td><td>${x.chat.filter(m=>m[0]=="u").length}</td></tr>`).join("")||"<tr><td>No users yet</td></tr>"}</table></div><button class="g" onclick="delete sessionStorage.adm;draw()">Lock</button>`}
function mo(uid,pid,a){const k="nd:u:"+uid+":up";let l=J(k)||[];l=a=="d"?l.filter(p=>String(p[8])!=pid):l.map(p=>String(p[8])==pid?(p[9]="a",p):p);LS.setItem(k,JSON.stringify(l));draw()}
function ex(t){const d=D(),T=new Date().toISOString().slice(0,10);
if(t=="u")dl(`nadara-users-${T}.csv`,csv([["id","name","email","joined","skin","pcos","pregnant","posts","checkins","questions"],...d.map(x=>[x.u.id,x.u.n,x.u.e,new Date(x.u.c).toISOString(),x.u.pf.skin,x.u.pf.pcos,x.u.pf.preg,x.posts.length,x.pl.length,x.chat.filter(m=>m[0]=="u").length])]),"text/csv");
if(t=="p")dl(`nadara-posts-${T}.csv`,csv([["id","author","email","title","text","product","status","has_media"],...d.flatMap(x=>x.posts.map(p=>[p[8],x.u.n,x.u.e,strip(p[3][0]),strip(p[4][0]),p[5],p[9]=="a"?"approved":"under review",p[7]?p[7][0]:""]))]),"text/csv");
if(t=="j")dl(`nadara-all-${T}.json`,JSON.stringify(d.map(x=>({user:{id:x.u.id,name:x.u.n,email:x.u.e,joined:new Date(x.u.c).toISOString(),profile:x.u.pf},posts:x.posts.map(p=>({id:p[8],title:strip(p[3][0]),text:strip(p[4][0]),product:p[5],status:p[9],media:p[7]?p[7][0]:null})),checkins:x.pl,questions:x.chat.filter(m=>m[0]=="u").map(m=>m[1])})),null,2));
if(t=="b"){const o={};for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k.startsWith("nd:")&&k!="nd:adm")o[k]=LS.getItem(k)}dl(`nadara-backup-${T}.json`,JSON.stringify(o))}}
function rs(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!confirm("Restore "+Object.keys(o).length+" items? Existing items with the same keys are replaced."))return;for(const k in o)if(k.startsWith("nd:")&&k!="nd:adm")LS.setItem(k,o[k]);draw()}catch(e){alert("Invalid backup file")}};r.readAsText(f)}
draw()
</script></body></html>
