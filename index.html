const RE=[[/pregnan|حمل|حامل/i,["During pregnancy, keep it simple: mineral sunscreen, gentle cleanser, ceramide moisturiser. Avoid retinoids and ask your doctor before acids. See the Pregnancy tab.","في الحمل ابقي الروتين بسيطاً: واقي شمس معدني ومنظف لطيف ومرطب بالسيراميد. تجنبي الريتينويدات واسألي طبيبك قبل الأحماض. شوفي تبويب الحمل."]],[/retin|ريتين/i,["Retinoids are usually avoided in pregnancy. Otherwise start 2 nights a week, use SPF, and expect some dryness.","الريتينويدات تُتجنب عادةً في الحمل. غير ذلك ابدئي ليلتين أسبوعياً مع واقي شمس وتوقعي بعض الجفاف."]],[/pcos|تكيس/i,["With PCOS, skin changes are often hormonal. Track your cycle in the PCOS tab and see your doctor, alongside a gentle acne routine.","مع تكيس المبايض غالباً تكون تغيرات البشرة هرمونية. تابعي دورتك في تبويب التكيس وراجعي طبيبك مع روتين لطيف للحبوب."]],[/acne|pimple|حب|حبوب/i,["For mild acne: gentle cleanser, non-comedogenic moisturiser, then one active (salicylic or azelaic acid). Add one product at a time.","للحبوب الخفيفة: منظف لطيف ومرطب لا يسد المسام ثم مادة فعالة واحدة (ساليسيليك أو أزيليك). أضيفي منتجاً واحداً كل مرة."]],[/sun|spf|شمس/i,["Use a broad-spectrum SPF 30+ every morning and reapply every 2 hours outdoors.","استخدمي واقي شمس واسع الطيف SPF 30+ كل صباح وجدديه كل ساعتين في الخارج."]],[/dry|itch|جاف|هرش|حكة/i,["Try a fragrance-free ceramide moisturiser right after washing. Intense itching that will not settle needs a doctor.","جربي مرطباً بالسيراميد بدون عطر بعد الغسل مباشرة. الحكة الشديدة المستمرة تحتاج طبيباً."]],[/price|cheap|سعر|اسعار|أسعار/i,["Open the Prices tab to compare the same product across pharmacies.","افتحي تبويب الأسعار لمقارنة نفس المنتج بين الصيدليات."]]];
